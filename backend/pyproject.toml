[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "converge"
version = "0.1.0"
description = "Multi-origin flight convergence solver (early build, rebuilding from scratch piece by piece)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["converge*"]

[tool.pytest.ini_options]
testpaths = ["converge/tests"]